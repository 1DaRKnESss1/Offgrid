<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Offgrid</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-state="idle" data-mode="idle" data-view="chat">
<div id="island"><div id="core">
  <div id="pill">
    <div class="pill-row">
      <span class="dot" aria-hidden="true"></span>
      <span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
      <span id="pill-text">Offgrid</span>
    </div>
    <div class="pill-confirm">
      <b>Потрібен твій дозвіл</b>
      <span id="pill-confirm-text"></span>
      <div class="pill-buttons">
        <button id="pill-deny" type="button">Відхилити</button>
        <button id="pill-allow" type="button" class="primary">Дозволити</button>
      </div>
    </div>
  </div>

  <div id="panel">
  <header>
    <span class="dot" aria-hidden="true"></span>
    <span id="state-label">Очікує</span>
    <span id="taint" hidden title="У цій розмові асистент бачив назви чи вміст файлів. Запис нотаток, пошук і відкриття сайтів тепер потребують твого дозволу. «Нова розмова» це скидає.">бачив файли</span>
    <span class="spacer"></span>
    <button id="speak" type="button" hidden aria-pressed="true"><span class="ic ic-sound"></span></button>
    <button id="open-control" type="button" title="Керування: музика, вікна, таймери" aria-label="Керування"><span class="ic ic-grid"></span></button>
    <button id="open-settings" type="button" title="Налаштування: програми, папки, типи файлів, клавіша" aria-label="Налаштування"><span class="ic ic-sliders"></span></button>
    <button id="open-log" type="button" title="Журнал дій" aria-label="Журнал дій"><span class="ic ic-list"></span></button>
    <button id="new-chat" type="button" title="Нова розмова: очистити історію" aria-label="Нова розмова"><span class="ic ic-new"></span></button>
    <button id="close" type="button" title="Згорнути (Esc)" aria-label="Згорнути"><span class="ic ic-collapse"></span></button>
  </header>

  <div id="view-chat" class="view">
  <main id="log" aria-live="polite"></main>

  <section id="confirm" hidden>
    <div class="confirm-title">Потрібен твій дозвіл</div>
    <div id="confirm-summary"></div>
    <div id="confirm-reason"></div>
    <div class="confirm-buttons">
      <button id="confirm-allow" type="button" class="primary">Дозволити</button>
      <button id="confirm-deny" type="button">Відхилити</button>
    </div>
  </section>

  <form id="form" autocomplete="off">
    <input id="input" type="text" maxlength="2000" placeholder="Напиши або скажи команду…" aria-label="Команда">
    <button id="mic" type="button" hidden aria-label="Говорити"><span class="ic ic-mic"></span></button>
    <button id="send" type="submit" class="primary" title="Надіслати (Enter)"><span class="ic ic-send"></span></button>
  </form>
  <footer id="hint"></footer>
  </div>

  <section id="view-settings" class="view" hidden aria-label="Налаштування">
    <div class="view-head">
      <button id="settings-back" type="button" title="Назад до розмови" aria-label="Назад"><span class="ic ic-back"></span></button>
      <span class="view-title">Налаштування</span>
    </div>
    <div id="settings-body" class="view-body"></div>
  </section>

  <section id="view-control" class="view" hidden aria-label="Керування">
    <div class="view-head">
      <button id="control-back" type="button" title="Назад до розмови" aria-label="Назад"><span class="ic ic-back"></span></button>
      <span class="view-title">Керування</span>
    </div>
    <div id="control-body" class="view-body tab-body"></div>
  </section>

  <section id="view-log" class="view" hidden aria-label="Журнал дій">
    <div class="view-head">
      <button id="log-back" type="button" title="Назад до розмови" aria-label="Назад"><span class="ic ic-back"></span></button>
      <span class="view-title">Журнал дій</span>
      <span class="spacer"></span>
      <button id="log-refresh" type="button" title="Оновити" aria-label="Оновити"><span class="ic ic-new"></span></button>
    </div>
    <div id="log-body" class="view-body tab-body"></div>
  </section>

  </div>
</div></div>

  <script src="bridge.js"></script>
  <script src="app.js"></script>
  <script src="settings.js"></script>
  <script src="control.js"></script>
  <script src="island.js"></script>
</body>
</html>
