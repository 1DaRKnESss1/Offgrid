<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Offgrid island prototype</title>
<style>
  :root { --key: rgb(2, 3, 5); --ink: #0c0c0e; --text: #f2f2f5; --muted: #9a9aa5; --accent: #5aa9ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none;
    font: 13px/1.35 "Segoe UI Variable Text", "Segoe UI", sans-serif; color: var(--text); }
  body { display: flex; justify-content: center; align-items: flex-start; padding-top: 10px; }

  #island {
    width: 150px; height: 36px; border-radius: 18px; background: var(--ink);
    transition: width .42s cubic-bezier(.3, 1.35, .45, 1), height .42s cubic-bezier(.3, 1.35, .45, 1), border-radius .42s ease;
    overflow: hidden; position: relative; cursor: grab;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .07), 0 6px 22px rgba(0, 0, 0, .45);
    -webkit-app-region: drag; app-region: drag;
  }
  #island[data-s="listening"] { width: 320px; height: 44px; border-radius: 22px; }
  #island[data-s="thinking"]  { width: 210px; height: 36px; }
  #island[data-s="speaking"]  { width: 380px; height: 64px; border-radius: 26px; }
  #island[data-s="confirm"]   { width: 380px; height: 118px; border-radius: 28px; }
  #island[data-s="open"]      { width: 400px; height: 300px; border-radius: 30px; }

  .row { position: absolute; inset: 0; display: flex; align-items: center; gap: 10px; padding: 0 14px;
    opacity: 0; transition: opacity .18s ease; pointer-events: none; white-space: nowrap; }
  #island[data-s="idle"] .idle, #island[data-s="listening"] .listening, #island[data-s="thinking"] .thinking,
  #island[data-s="speaking"] .speaking, #island[data-s="confirm"] .confirm, #island[data-s="open"] .open
    { opacity: 1; transition: opacity .25s ease .16s; pointer-events: auto; }

  .dot { width: 9px; height: 9px; border-radius: 50%; background: #6b6b76; flex: none; }
  .listening .dot { background: #ff5d5d; animation: pulse 1.1s ease-in-out infinite; }
  .thinking .dot { background: #ffc24a; animation: pulse .8s ease-in-out infinite; }
  .speaking .dot { background: var(--accent); }
  @keyframes pulse { 50% { transform: scale(1.5); opacity: .6; } }
  .name { font-weight: 600; letter-spacing: .2px; }
  .muted { color: var(--muted); }
  .grow { flex: 1; overflow: hidden; text-overflow: ellipsis; }

  .wave { display: flex; align-items: center; gap: 3px; height: 22px; flex: none; }
  .wave i { width: 3px; border-radius: 2px; background: #ff7b7b; animation: wave 0.9s ease-in-out infinite; }
  .speaking .wave i { background: var(--accent); }
  .wave i:nth-child(1) { animation-delay: -.8s } .wave i:nth-child(2) { animation-delay: -.55s }
  .wave i:nth-child(3) { animation-delay: -.3s } .wave i:nth-child(4) { animation-delay: -.65s }
  .wave i:nth-child(5) { animation-delay: -.1s }
  @keyframes wave { 0%, 100% { height: 4px } 50% { height: 20px } }

  .speaking { align-items: center; white-space: normal; }
  .speaking .grow { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .confirm, .open { flex-direction: column; align-items: stretch; justify-content: center; white-space: normal; padding: 14px 18px; }
  .confirm b { font-size: 13.5px; }
  .buttons { display: flex; gap: 8px; margin-top: 4px; }
  button { -webkit-app-region: no-drag; app-region: no-drag; flex: 1; font: inherit; color: var(--text); background: #25252b;
    border: 0; border-radius: 12px; padding: 8px 10px; cursor: pointer; }
  button.primary { background: var(--accent); color: #06121f; font-weight: 600; }
  button:hover { filter: brightness(1.15); }
  .open { justify-content: flex-start; gap: 8px; }
  .bubble { align-self: flex-start; background: #1d1d22; border-radius: 14px; padding: 7px 11px; max-width: 85%; }
  .bubble.me { align-self: flex-end; background: #1f4f80; }
  .field { margin-top: auto; background: #1d1d22; border-radius: 14px; padding: 9px 12px; color: var(--muted); }
  #hud { position: fixed; left: 0; right: 0; bottom: 6px; text-align: center; font-size: 11px; color: #55555e; }
</style>
</head>
<body>
<div id="island" data-s="idle">
  <div class="row idle"><span class="dot"></span><span class="name">Offgrid</span><span class="muted grow" id="fps"></span></div>
  <div class="row listening"><span class="dot"></span><span class="wave"><i></i><i></i><i></i><i></i><i></i></span><span class="grow">vidkryi bloknot i zapyshy...</span></div>
  <div class="row thinking"><span class="dot"></span><span class="grow">Dumaiu...</span></div>
  <div class="row speaking"><span class="wave"><i></i><i></i><i></i><i></i><i></i></span><span class="grow">Bloknot vidkryto. Zaraz chetverta hodyna dvadtsiat khvylyn, nadvori plius visim.</span></div>
  <div class="row confirm"><b>Zakryty prohramu "Bloknot"?</b><span class="muted">Nezberezhene vona mozhe zaproponuvaty zberehty.</span>
    <div class="buttons"><button>Ni</button><button class="primary">Dozvolyty</button></div></div>
  <div class="row open"><div class="bubble me">kotra hodyna</div><div class="bubble">Zaraz chetverta hodyna dvadtsiat khvylyn.</div>
    <div class="field">Napyshy abo skazhy komandu...</div></div>
</div>
<script>
  // Demo: the island walks through its states by itself; a click toggles the open panel.
  const island = document.getElementById('island');
  const order = ['idle', 'listening', 'thinking', 'speaking', 'idle', 'confirm', 'idle', 'open'];
  let i = 0, manual = false;
  const auto = new URLSearchParams(location.search).get('auto') !== '0';
  const forced = new URLSearchParams(location.search).get('s');
  if (forced) island.dataset.s = forced;
  else if (auto) setInterval(() => { if (!manual) island.dataset.s = order[++i % order.length]; }, 2200);
  island.addEventListener('dblclick', () => { manual = true; island.dataset.s = island.dataset.s === 'open' ? 'idle' : 'open'; });
  // Tell the host which part of the window is really occupied (island + room for its shadow).
  // Growing: claim the bigger box at once. Shrinking: give the space back only when the animation is over.
  const SIZES = { idle: [150, 36], listening: [320, 44], thinking: [210, 36], speaking: [380, 64], confirm: [380, 118], open: [400, 300] };
  let box = [0, 0], shrink = null;
  function post(w, h) {
    box = [w, h];
    const pad = 24, vw = document.documentElement.clientWidth;
    window.chrome?.webview?.postMessage({ t: 'box', x: Math.round((vw - w) / 2) - pad, y: 0, w: w + pad * 2, h: h + 10 + pad * 1.5 });
  }
  function claim() {
    const [w, h] = SIZES[island.dataset.s];
    clearTimeout(shrink);
    post(Math.max(w, box[0]) + 16, Math.max(h, box[1]) + 16); // +16: the spring overshoots a little
    shrink = setTimeout(() => post(w, h), 520);
  }
  new MutationObserver(claim).observe(island, { attributes: true, attributeFilter: ['data-s'] });
  claim();
  // frame-rate meter: tells whether the animation is smooth
  let frames = 0, last = performance.now();
  (function tick(now) {
    frames++;
    if (now - last >= 1000) { document.getElementById('fps').textContent = frames + ' fps'; window.chrome?.webview?.postMessage({ t: 'fps', v: frames }); frames = 0; last = now; }
    requestAnimationFrame(tick);
  })(last);
</script>
</body>
</html>
